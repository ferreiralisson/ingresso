spring.application.name=ingresso-api
spring.profiles.default=dev
spring.profiles.default=dev
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.datasource.url=${INGRESSO_DB_URL:jdbc:h2:file:./data/ingresso}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${INGRESSO_DB_USERNAME:sa}
spring.datasource.password=${INGRESSO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.h2.console.path=/h2-console
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
token.secret=${TOKEN_SECRET}
ingresso.payment.mock.default-result=${INGRESSO_PAYMENT_MOCK_RESULT:APPROVED}

server.port=${PORT:8081}